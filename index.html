<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevQuiz</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1828/1828884.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-particles" id="bg-particles"></div>
<div class="bg-vignette"></div>

<header class="site-header">
  <div class="header-ornament left">❖</div>
  <h1 class="title">
    <span class="title-dev">Dev</span><span class="title-quiz">Quiz</span>
    <span class="title-sub">Four of lifes</span>
  </h1>
  <div class="header-ornament right">❖</div>
</header>

<!-- PLAYER LOGIN -->
<div id="player-login" class="panel login-box">
  <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
  <div class="panel-corner bl"></div><div class="panel-corner br"></div>
  <h2>Enter the Arena</h2>
  <input type="text" id="username" placeholder="Your name...">
  <select id="category">
    <option value="javascript">⚡ JavaScript</option>
    <option value="python">🐍 Python</option>
  </select>

  <div class="difficulty-section">
    <h3>Choose Difficulty</h3>
    <div class="difficulty-grid">
      <label class="diff-card" data-diff="beginner">
        <input type="radio" name="difficulty" value="beginner">
        <span class="diff-icon">🌿</span>
        <span class="diff-name">Beginner</span>
        <span class="diff-desc">Levels 1–2</span>
      </label>
      <label class="diff-card" data-diff="normal">
        <input type="radio" name="difficulty" value="normal" checked>
        <span class="diff-icon">⚔️</span>
        <span class="diff-name">Normal</span>
        <span class="diff-desc">Levels 1–3</span>
      </label>
      <label class="diff-card" data-diff="expert">
        <input type="radio" name="difficulty" value="expert">
        <span class="diff-icon">💀</span>
        <span class="diff-name">Expert</span>
        <span class="diff-desc">Levels 1–5</span>
      </label>
    </div>
  </div>

  <h3>Choose Your Seal</h3>
  <div id="avatars">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=alpha&backgroundColor=b6e3f4" class="avatar" alt="Avatar 1">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=beta&backgroundColor=c0aede" class="avatar" alt="Avatar 2">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=gamma&backgroundColor=d1d4f9" class="avatar" alt="Avatar 3">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=delta&backgroundColor=ffd5dc" class="avatar" alt="Avatar 4">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=epsilon&backgroundColor=c0e0c0" class="avatar" alt="Avatar 5">
  </div>
  <button onclick="loginPlayer()" class="btn-primary">⚜ Begin Your Trial</button>
</div>

<!-- PLAYER DASHBOARD -->
<div id="player-dashboard" class="panel hidden">
  <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
  <div class="panel-corner bl"></div><div class="panel-corner br"></div>
  <div class="dashboard-header">
    <img id="dashboard-avatar" src="" class="dashboard-avatar">
    <div class="dashboard-info">
      <div id="dashboard-name" class="player-name"></div>
      <div id="dashboard-score" class="player-score">⚜ Score: 0</div>
      <div id="dashboard-level" class="player-level">Rank I</div>
      <div id="dashboard-diff" class="player-diff"></div>
    </div>
  </div>
  <div class="dash-buttons">
    <button onclick="startQuiz()" class="btn-primary">⚔ Enter Trial</button>
    <button onclick="showRanking()" class="btn-secondary">📜 Hall of Legends</button>
    <button onclick="logoutPlayer()" class="btn-ghost">↩ Back</button>
  </div>
  <div class="level-bar-container">
    <div class="level-labels" id="level-labels"></div>
    <div class="level-track">
      <div class="level-fill" id="level-fill"></div>
      <div class="level-fill-glow" id="level-fill-glow"></div>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="panel hidden">
  <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
  <div class="panel-corner bl"></div><div class="panel-corner br"></div>
  <div class="quiz-header">
    <button onclick="goBack()" class="btn-ghost small">↩ Back</button>
    <img id="player-avatar" src="" class="quiz-avatar">
    <div id="level-tag" class="level-tag"></div>
  </div>

  <div class="question-card">
    <div class="qcard-inner">
      <span class="q-number" id="q-number"></span>
      <h2 id="question"></h2>
    </div>
  </div>

  <!-- ALWAYS-VISIBLE FLIP CARD -->
  <div class="flip-card-arena">
    <div class="flip-card" id="flip-card">
      <div class="flip-inner" id="flip-inner">

        <!-- FRONT: Choices -->
        <div class="flip-front" id="flip-front">
          <div class="flip-front-label">⚔ Choose your answer</div>
          <div id="choices" class="choices-grid"></div>
        </div>

        <!-- BACK: Result -->
        <div class="flip-back" id="flip-back">
          <div class="back-result-icon" id="back-result-icon"></div>
          <div class="back-result-text" id="back-result-text"></div>
          <div class="back-your-wrap">
            <span class="back-label">Your Answer</span>
            <span class="back-your" id="back-your"></span>
          </div>
          <div class="back-divider">
            <span class="back-divider-line"></span>
            <span class="back-divider-icon">✦</span>
            <span class="back-divider-line"></span>
          </div>
          <div class="back-correct-wrap">
            <span class="back-label">Correct Answer</span>
            <span class="back-correct" id="back-correct"></span>
          </div>
          <button class="btn-next-rune" id="btn-next" onclick="nextQuestion(event)">Next ▶</button>
        </div>

      </div>
    </div>
    <div class="flip-hint" id="flip-hint">Select an answer to reveal the rune</div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="panel hidden">
  <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
  <div class="panel-corner bl"></div><div class="panel-corner br"></div>
  <div class="result-content">
    <div class="trophy">🏆</div>
    <h2>Trial Complete!</h2>
    <p id="score" class="final-score"></p>
    <div id="result-rank" class="result-rank"></div>
    <button onclick="showRanking()" class="btn-secondary" style="margin-bottom:10px;">📜 Hall of Legends</button>
    <button onclick="goBack()" class="btn-primary">↩ Dashboard</button>
  </div>
</div>

<!-- RANKING -->
<div id="ranking" class="panel hidden">
  <div class="panel-corner tl"></div><div class="panel-corner tr"></div>
  <div class="panel-corner bl"></div><div class="panel-corner br"></div>
  <div class="rank-header">
    <button onclick="goBack()" class="btn-ghost small">↩ Back</button>
    <h2>📜 Hall of Legends</h2>
  </div>
  <div id="rank-list" class="rank-list"></div>
</div>

<script src="script.js"></script>
</body>
</html>
